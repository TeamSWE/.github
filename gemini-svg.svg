<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <rect x="-240" y="0" width="180" height="400" fill="#ffffff" opacity="0.035" transform="skewX(-18)">
    <animate attributeName="x" from="-240" to="1260" dur="9s" repeatCount="indefinite" />
  </rect>
  <path d="M0 320 C220 280 350 350 560 310 S930 250 1200 300" stroke="#60a5fa" stroke-width="2" opacity="0.25" fill="none" stroke-dasharray="8 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Decorative Glow Orbs -->
  <circle cx="150" cy="80" r="120" fill="#3b82f6" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="120;145;120" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.24;0.15" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="320" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="140;115;140" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.23;0.15" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Abstract Code Brackets Background Elements -->
  <text x="60" y="240" fill="#30363d" font-family="monospace" font-size="220" font-weight="bold" opacity="0.3">&lt;</text>
  <text x="1000" y="240" fill="#30363d" font-family="monospace" font-size="220" font-weight="bold" opacity="0.3">&gt;</text>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="1.5">
    BUILDING THE <tspan fill="url(#accentGrad)">FUTURE</tspan> OF CODE
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    Collaborative Software Engineering Students &amp; Innovators
  </text>

  <!-- Tech Stack Pills / Badges Background Layer -->
  <g transform="translate(360, 260)" opacity="0.9">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="55" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="600">Full-Stack</text>

    <!-- Pill 2 -->
    <rect x="125" y="0" width="110" height="36" rx="18" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="180" y="23" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="13" font-weight="600">Backend</text>

    <!-- Pill 3 -->
    <rect x="250" y="0" width="135" height="36" rx="18" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="317" y="23" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="13" font-weight="600">Data Science</text>

    <!-- Pill 4 -->
    <rect x="400" y="0" width="95" height="36" rx="18" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="447" y="23" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="13" font-weight="600">DevOps</text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="392" width="1200" height="8" fill="url(#accentGrad)" />
</svg>
